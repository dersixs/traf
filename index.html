💡 Важное правило для стабильной работы аккаунта
• Без включенного VPN в Instagram заходить СТРОГО НЕЛЬЗЯ. Приложение открываем только тогда, когда VPN уже успешно подключен.

🛠️ ЭТАП 1. Подготовка устройства и регистрация

1. Выбор и настройка устройства
• Приоритет устройств: Идеально подойдет iPhone. Если его нет, используйте Android или свой основной телефон.
• Сброс настроек: По возможности сбросьте запасной телефон до заводских настроек (если телефон один и он основной — этот шаг пропускаем).
• ГЕО-настройки: При первичной настройке системы укажите:
  - Регион: United States (US)
  - Язык системы: English

2. Подключение VPN и установка приложения
1) Скачайте приложение v2RayTun или Happ.
2) Настройте и включите VPN с локацией США. Убедитесь, что соединение стабильно.
3) Только после включения VPN перейдите в App Store / Google Play и скачайте Instagram.

3. Регистрация аккаунта
1) Откройте Instagram (при включенном VPN США).
2) Зарегистрируйте новый аккаунт, используя почту Gmail.
3) Запретите приложению доступ к геолокации.
4) Запретите приложению доступ к контактам.
5) Уведомления разрешите по своему желанию.

━━━━━━━━━━━━━━━━━━

🔥 ЭТАП 2. День 1 — Первичный прогрев

Главная цель дня: Сформировать англоязычную ленту на тему криптовалюты и трейдинга. Русскоязычные ролики сразу пролистываем.

📈 Что делать, если не получается попасть в крипто-рекомендации:
1) Найдите в Reels любой ролик про «дорогой образ жизни» (машины, часы, пачки денег).
2) Посмотрите его до конца и поставьте лайк.
3) Продолжайте листать ленту. Как только появится ролик про крипту или трейдинг — досмотрите до конца и лайкните.
4) Повторяйте, пока лента полностью не забьется нужной тематикой.

🕒 Расписание и хронометраж:
За день необходимо сделать 2 подхода по 20 минут.

• 1-й подход (Днем) — 20 минут:
  - 7 минут — просмотр постов-картинок в общей ленте.
  - 10 минут — непрерывный просмотр Reels.
  - 3 минуты — просмотр постов-картинок.

• 2-й подход (Вечером, около 22:00 по МСК) — 20 минут:
  - Полностью повторите схему дневного подхода.

⚠️ Рекомендации по лимитам в 1-й день:
- Лайки: Не стоит лайкать всё подряд. Ограничьтесь 3–4 лайками за весь первый день.
- Подписки: За весь первый день сделайте всего 1 подписку — обязательно на качественный аккаунт по крипто-тематике.

🖼️ Установка аватарки (В конце 1-го дня):
После завершения вечернего подхода можно установить аватарку профиля.
- Где взять: Желательно найти картинку в Pinterest (например, человек, стоящий у дорогой машины).
- Альтернатива: Подойдет любая другая адекватная аватарка, соответствующая тематике успеха и дорогой жизни.

━━━━━━━━━━━━━━━━━━

• Вечером (20 минут): Продолжайте смотреть тематический контент перед публикацией.

⚠️ Рекомендации по подпискам во 2-й день:
- За весь второй день сделайте еще 2 подписки, тоже строго на крупные целевые аккаунты по крипто-тематике.

🎬 Публикация первого ролика (около 22:00 по МСК):
1) Возьмите готовый видеоролик, выданный владельцем проекта (самим монтировать ничего не нужно).
2) Наложите аудиодорожку из предоставленного списка музыки.
3) Скопируйте и вставьте выданные вам целевые хештеги.
4) Опубликуйте видео.
5) После публикации полистайте ленту крипты еще 1 минуту, затем полностью закройте и смахните приложение, и только потом выключайте VPN.

━━━━━━━━━━━━━━━━━━

📊 ЭТАП 4. День 3 — Переход на 2 публикации

🧐 Аналитика (Проверка просмотров первого Reels утром):
• 150–250 просмотров — отличный стартовый результат.
• Около 50 просмотров — нормальный рабочий показатель, продолжаем.
• 0–1 просмотр — не расстраивайтесь, алгоритмам нужно время, чтобы раскачаться. Просто следуйте мануалу дальше.

📋 Пошаговый план публикаций:
1) Зайдите в Instagram (под VPN США), посмотрите Reels по нашей теме в течение 2 минут.
2) Выложите первый ролик дня (используя выданные видео, музыку и теги).
3) Сделайте перерыв минимум 3 часа.
4) Снова зайдите в приложение, немного полистайте целевую ленту.
5) Выложите второй ролик дня.

━━━━━━━━━━━━━━━━━━

Переходим к этому этапу, если аккаунт работает стабильно и ролики собирают просмотры.

📋 Пошаговый план:
1) Утром проверьте статистику предыдущих видео.
2) Подготовьте материалы на день (4–5 роликов).
3) Публикуйте ролики поочередно в течение дня с интервалом около 1 часа между ними.

🎯 Ориентиры по просмотрам на данном этапе:
• 200–300 просмотров — базовый ориентир.
• 1 000–2 000 просмотров — хороший целевой результат.
• 5 000–10 000+ просмотров — прекрасный результат, аккаунт попал в рекомендации.

━━━━━━━━━━━━━━━━━━

🤑 ЭТАП 6. День 6-7 и далее — Работа на постоянной основе

• Контроль просмотров: Обязательно отслеживайте, нормально ли набирают просмотры предыдущие ролики (оптимально удерживать планку в 300–500 просмотров и выше на каждом видео).
• Тактика при падении просмотров: Если вы заметили, что последние видео набрали очень мало просмотров, сделайте паузу. Дайте аккаунту перерыв примерно на 2 часа, и только после этого выкладывайте новый видеоролик. Если всё в порядке — продолжайте постить в обычном темпе.
• Объем контента: В таком поточном режиме за весь день можно спокойно публиковать от 15 до 20 видео.

━━━━━━━━━━━━━━━━━━

📋 Инструкция по работе с контентом

1. Хештеги
Просто скопируйте предоставленный список хештегов и вставляйте их в описание каждый раз, когда выкладываете видео.

Это финальный этап перед самой публикацией видео в Инстаграм. Очищать метаданные нужно ВСЕГДА — даже после того, как вы прогнали видео через уникализатор.
